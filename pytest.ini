[pytest]
# Pytest configuration for panDecay

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 6.0

# Additional options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for categorizing tests
markers =
    requires_paup: Tests that require PAUP* to be installed
    requires_mrbayes: Tests that require MrBayes to be installed
    slow: Tests that take significant time to run
    integration: Integration tests that test full workflows
    unit: Unit tests for individual components

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=pandecay --cov-report=html --cov-report=term

# Ignore patterns
norecursedirs = .git .tox dist build *.egg htmlcov debug_runs

# Console output style
console_output_style = progress

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
